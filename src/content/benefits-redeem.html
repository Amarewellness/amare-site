<section class="benefits-redeem" data-benefits-redeem-root>
  <div class="benefits-redeem__panel">
    <p class="benefits-redeem__brand">AMARÉ Member Benefit</p>
    <h1 class="benefits-redeem__title" data-benefits-redeem-title>Loading…</h1>
    <p class="benefits-redeem__partner" data-benefits-redeem-partner hidden></p>
    <p class="benefits-redeem__member" data-benefits-redeem-member hidden></p>
    <p class="benefits-redeem__valid" data-benefits-redeem-valid hidden></p>
    <div class="benefits-redeem__location" data-benefits-redeem-location hidden>
      <p class="benefits-redeem__location-label">Redeem at</p>
      <p class="benefits-redeem__location-address" data-benefits-redeem-location-address></p>
      <a class="benefits-redeem__map-link" data-benefits-redeem-map-link href="#" target="_blank" rel="noopener noreferrer">Open map</a>
    </div>
    <p class="benefits-redeem__terms" data-benefits-redeem-terms hidden></p>
    <p class="benefits-redeem__hint" data-benefits-redeem-hint>
      Confirm only after providing the benefit to the member.
    </p>
    <div class="benefits-redeem__actions" data-benefits-redeem-actions hidden>
      <button type="button" class="btn btn--cream benefits-redeem__confirm" data-benefits-redeem-confirm>
        Confirm redemption
      </button>
    </div>
    <p class="benefits-redeem__status" data-benefits-redeem-status aria-live="polite"></p>
  </div>
</section>
<link rel="stylesheet" href="/css/components-member-benefits.css" />
<script defer src="/js/benefits-redeem.js"></script>
