<script type="application/json" id="mb-stripe-onetime-config">

<script type="application/json" id="mb-stripe-recurring-config">

<div
  id="mb-schedule-root"
  class="mb-wrap mb-schedule-api"
  data-mb-proxy="__MB_SCHEDULE_ORIGIN__"
>
  <div class="mb-wrap__intro">
    <h1>Class schedule</h1>
    <aside class="mb-app-teaser" aria-label="AMARÉ mobile app coming soon to the App Store and Google Play">
      <p class="mb-app-teaser__title">AMARÉ App — Coming Soon</p>
      <div class="mb-app-teaser__stores" aria-hidden="true">
        <span class="mb-app-teaser__store mb-app-teaser__store--apple">
          <svg class="mb-app-teaser__icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"
            />
          </svg>
          <span class="mb-app-teaser__store-name">App Store</span>
        </span>
        <span class="mb-app-teaser__store mb-app-teaser__store--google">
          <svg class="mb-app-teaser__icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              d="M3 20.5V3.5C3 2.91 3.34 2.39 3.84 2.15L13.69 12 3.84 21.85C3.34 21.61 3 21.09 3 20.5m13.81-5.38L6.05 21.34l8.49-8.49 2.27 2.27m3.35-4.31c.34.27.59.69.59 1.19s-.25.92-.57 1.19l-2.29 1.32-2.5-2.5 2.5-2.5 2.29 1.32M6.05 2.66l10.76 6.22-2.27 2.27L6.05 2.66Z"
            />
          </svg>
          <span class="mb-app-teaser__store-name">Google Play</span>
        </span>
      </div>
    </aside>
    <div id="mb-auth-strip" class="mb-auth-bar" aria-live="polite" hidden>
      Checking account…
    </div>
    <div id="mb-schedule-wallet" class="mb-schedule-wallet" hidden aria-live="polite"></div>
    <div id="mb-schedule-topup" class="mb-schedule-guest-pass mb-schedule-topup" hidden aria-live="polite"></div>
    <div id="mb-schedule-guest-pass" class="mb-schedule-guest-pass" hidden aria-live="polite"></div>
    <div id="mb-my-schedule-wrap" class="mb-schedule-intro-actions" hidden>
      <button type="button" id="mb-my-schedule-open" class="btn btn--ghost mb-my-schedule-open">
        My schedule
      </button>
    </div>
  </div>

  <section class="mb-schedule-filters" id="mb-schedule-filters" aria-label="Filters" hidden>
    <button
      type="button"
      class="mb-schedule-filters__toggle"
      id="mb-flt-expand"
      aria-expanded="false"
      aria-controls="mb-flt-extra"
    >
      Show more filter options
    </button>
    <div id="mb-flt-extra" class="mb-schedule-filters__extra" hidden>
      <div class="mb-schedule-filters__head">
        <h2 class="mb-schedule-filters__title">More filters</h2>
        <button type="button" class="mb-schedule-filters__clear" id="mb-flt-reset">Clear all</button>
      </div>
      <div class="mb-schedule-filters__grid">
        <div class="mb-schedule-filter">
          <label for="mb-flt-time">Time of day (ET)</label>
          <select id="mb-flt-time">
            <option value="">Any time</option>
            <option value="morning">Morning (before noon)</option>
            <option value="afternoon">Afternoon (12:00 PM – 4:59 PM)</option>
            <option value="evening">Evening (5:00 PM – 8:59 PM)</option>
            <option value="late">Late evening (after 9:00 PM)</option>
            <option value="earlybird">Early (before 7:00 AM)</option>
          </select>
        </div>
        <div class="mb-schedule-filter">
          <label for="mb-flt-instructor">Instructor</label>
          <select id="mb-flt-instructor">
            <option value="">All instructors</option>
          </select>
        </div>
        <div class="mb-schedule-filter mb-schedule-filter--span">
          <label for="mb-flt-q">Search</label>
          <input
            type="search"
            id="mb-flt-q"
            placeholder="Search class or instructor"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
      </div>
    </div>
  </section>

  <div class="mb-frame mb-schedule-api__surface" aria-busy="true" aria-live="polite">
    <div id="mb-schedule-status" class="mb-schedule-api__status" role="status"></div>

    <div class="mb-schedule-calendar" id="mb-schedule-calendar" hidden>
      <p class="mb-schedule-daystrip__hint" id="mb-daystrip-label" lang="en">
        Choose the day
      </p>
      <div class="mb-schedule-daystrip-shell">
        <button
          type="button"
          class="mb-schedule-daystrip__nav-btn mb-schedule-daystrip__nav-btn--prev"
          id="mb-day-strip-prev"
          aria-controls="mb-day-strip"
          aria-label="Show earlier dates"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 6l-6 6 6 6"
            />
          </svg>
        </button>
        <div
          id="mb-day-strip"
          class="mb-schedule-daystrip"
          role="tablist"
          aria-label="Pick a calendar day · Eastern US"
        ></div>
        <button
          type="button"
          class="mb-schedule-daystrip__nav-btn mb-schedule-daystrip__nav-btn--next"
          id="mb-day-strip-next"
          aria-controls="mb-day-strip"
          aria-label="Show later dates"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 6l6 6-6 6"
            />
          </svg>
        </button>
      </div>
      <div class="mb-schedule-classselect-field">
        <label class="mb-schedule-classstrip__hint mb-schedule-classselect__label" for="mb-class-type-trigger">
          Class type · this day
        </label>
        <div class="mb-schedule-classselect" id="mb-class-type-combo">
          <button
            type="button"
            id="mb-class-type-trigger"
            class="mb-schedule-classselect-trigger"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="mb-class-type-listbox"
            aria-label="Class type for selected day"
          >
            <span class="mb-schedule-classselect-trigger__text">All classes</span>
            <span class="mb-schedule-classselect-trigger__caret" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M6 9l6 6 6-6"
                />
              </svg>
            </span>
          </button>
          <ul id="mb-class-type-listbox" class="mb-schedule-classselect-list" role="listbox" hidden></ul>
        </div>
      </div>
    </div>
    <div id="mb-schedule-content" class="mb-schedule-api__content"></div>
  </div>
</div>

<dialog
  id="mb-my-schedule-dialog"
  class="mb-book-dialog form-sent-dialog mb-my-schedule-dialog"
  aria-labelledby="mb-my-schedule-title"
>
  <div class="form-sent-dialog__panel mb-book-dialog__panel">
    <button type="button" class="mb-book-dialog__x" id="mb-my-schedule-close" aria-label="Close dialog">×</button>
    <h2 id="mb-my-schedule-title" class="form-sent-dialog__title mb-book-dialog__title">My schedule</h2>
    <div id="mb-my-schedule-body" class="mb-book-dialog__body form-sent-dialog__text"></div>
  </div>
</dialog>

<dialog id="mb-book-dialog" class="mb-book-dialog form-sent-dialog" aria-labelledby="mb-book-dialog-title">
  <div class="form-sent-dialog__panel mb-book-dialog__panel">
    <button type="button" class="mb-book-dialog__x" aria-label="Close dialog">×</button>
    <h2 id="mb-book-dialog-title" class="form-sent-dialog__title mb-book-dialog__title">Book this class</h2>
    <div id="mb-book-dialog-body" class="mb-book-dialog__body form-sent-dialog__text"></div>
    <div id="mb-book-dialog-actions" class="mb-book-dialog__actions"></div>
  </div>
</dialog>

<dialog
  id="mb-schedule-guest-pass-dialog"
  class="mb-guest-pass-dialog"
  aria-labelledby="mb-schedule-baf-dialog-title"
>
  <form method="dialog" class="mb-guest-pass-dialog__inner" id="mb-schedule-guest-pass-form">
    <h3 id="mb-schedule-baf-dialog-title" class="mb-guest-pass-dialog__title">Bring a Friend</h3>
    <p class="mb-member__hint">Pick a class you're already booked into, then add your guest's details.</p>
    <label class="mb-guest-pass-field">
      <span class="mb-guest-pass-field__label">Class</span>
      <select name="classId" id="mb-schedule-guest-pass-class" required></select>
    </label>
    <label class="mb-guest-pass-field">
      <span class="mb-guest-pass-field__label">Guest first name</span>
      <input type="text" name="guestFirstName" autocomplete="given-name" required maxlength="80" />
    </label>
    <label class="mb-guest-pass-field">
      <span class="mb-guest-pass-field__label">Guest last name</span>
      <input type="text" name="guestLastName" autocomplete="family-name" required maxlength="80" />
    </label>
    <label class="mb-guest-pass-field">
      <span class="mb-guest-pass-field__label">Guest email</span>
      <input type="email" name="guestEmail" autocomplete="email" required maxlength="254" />
    </label>
    <label class="mb-guest-pass-field">
      <span class="mb-guest-pass-field__label">Guest phone</span>
      <input type="tel" name="guestPhone" autocomplete="tel" required maxlength="32" />
    </label>
    <label class="mb-guest-pass-consent">
      <input type="checkbox" name="bookingConsentAccepted" value="1" required />
      <span id="mb-schedule-guest-pass-consent-text"></span>
    </label>
    <p class="mb-member__err" id="mb-schedule-guest-pass-err" hidden></p>
    <div class="mb-guest-pass-dialog__actions">
      <button type="button" class="btn btn--ghost" id="mb-schedule-guest-pass-cancel">Cancel</button>
      <button type="submit" class="btn btn--cream" id="mb-schedule-guest-pass-submit">Book guest</button>
    </div>
  </form>
</dialog>

<dialog
  id="mb-schedule-guest-pass-success"
  class="mb-book-dialog form-sent-dialog mb-guest-pass-success"
  aria-labelledby="mb-schedule-baf-success-title"
>
  <div class="form-sent-dialog__panel mb-book-dialog__panel">
    <button type="button" class="mb-book-dialog__x" id="mb-schedule-guest-pass-success-close" aria-label="Close dialog">×</button>
    <h2 id="mb-schedule-baf-success-title" class="form-sent-dialog__title mb-book-dialog__title">Guest booked</h2>
    <div class="mb-book-dialog__body form-sent-dialog__text" id="mb-schedule-guest-pass-success-body"></div>
    <div class="mb-book-dialog__actions">
      <button type="button" class="btn btn--cream mb-book-dialog__ok" id="mb-schedule-guest-pass-success-ok">Got it</button>
    </div>
  </div>
</dialog>
