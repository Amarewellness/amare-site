# Stripe → Mindbody one-time checkout (NCS / drop-in / class packs) AND recurring monthly
# memberships (Option A — Stripe handles billing, Mindbody syncs as Pricing Option grants
# on every invoice.paid). Both flows share `stripe-create-checkout-session` and
# `stripe-webhook`; the function dispatches by `kind` / `stripeMode`.
# See docs/STRIPE-MINDBODY-QUESTIONS.md and docs/MEMBERSHIP-RECURRING-CHECKOUT.md.

[[redirects]]
  from = "/api/stripe/checkout/create-session"
  to = "/.netlify/functions/stripe-create-checkout-session"
