[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  # Include the build-time-generated catalog + contract-terms JSON files in every function bundle.
  # esbuild (Netlify's default bundler) does not ship arbitrary asset files by default — without this
  # `stripe-catalog-lib.mjs` and `load-mb-contract-terms.mjs` would `ENOENT` at runtime in production.
  included_files = ["netlify/functions/_embedded/**/*.json"]

# SMS discovery scans many Mindbody clients — allow max synchronous runtime (Pro: up to 60s).
# If dry-run still times out, lower discovery caps in Netlify env (see docs/NEW-CLIENT-SMS-FOLLOWUP.md).
[functions."new-client-sms-scan"]
  timeout = 60

# Staff shift availability reminder — Tuesday ~10:00 AM US Eastern (14:00 UTC).
# Schedule must live in netlify.toml (export const config alone did not register on Netlify).
[functions."staff-schedule-availability-reminder-scan"]
  schedule = "0 14 * * 2"

[functions."mindbody-oauth-complete-studio-profile"]
  timeout = 26

