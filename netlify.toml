[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/mindbody/oauth/start"
  to = "/.netlify/functions/mindbody-oauth-start"
  status = 200

[[redirects]]
  from = "/api/mindbody/oauth/callback"
  to = "/.netlify/functions/mindbody-oauth-callback"
  status = 200

[[redirects]]
  from = "/api/mindbody/oauth/session"
  to = "/.netlify/functions/mindbody-oauth-session"
  status = 200

[[redirects]]
  from = "/api/mindbody/oauth/logout"
  to = "/.netlify/functions/mindbody-oauth-logout"
  status = 200

[[redirects]]
  from = "/api/mindbody/class/classes"
  to = "/.netlify/functions/mindbody-class-classes"
  status = 200

[[redirects]]
  from = "/api/mindbody/site/sites"
  to = "/.netlify/functions/mindbody-site-sites"
  status = 200

[[redirects]]
  from = "/api/mindbody/member/summary"
  to = "/.netlify/functions/mindbody-member-summary"
  status = 200

[[redirects]]
  from = "/api/mindbody/class/book"
  to = "/.netlify/functions/mindbody-class-book"
  status = 200

[[redirects]]
  from = "/api/mindbody/class/cancel"
  to = "/.netlify/functions/mindbody-class-cancel"
  status = 200

[[redirects]]
  from = "/api/mindbody/sale/services"
  to = "/.netlify/functions/mindbody-sale-services"
  status = 200

[[redirects]]
  from = "/api/mindbody/sale/contracts"
  to = "/.netlify/functions/mindbody-sale-contracts"
  status = 200

[[redirects]]
  from = "/api/mindbody/sale/checkout"
  to = "/.netlify/functions/mindbody-sale-checkout"
  status = 200

[[redirects]]
  from = "/api/mindbody/sale/purchase-contract"
  to = "/.netlify/functions/mindbody-sale-purchase-contract"
  status = 200

[[redirects]]
  from = "/api/mindbody/sale/checkout-warmup"
  to = "/.netlify/functions/mindbody-sale-checkout-warmup"
  status = 200

[[redirects]]
  from = "/api/mindbody/client/stored-cards"
  to = "/.netlify/functions/mindbody-client-stored-cards"
  status = 200

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
